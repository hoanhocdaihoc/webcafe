<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt món - Cafe House</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fffaf7;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
    }
    .navbar {
      background-color: #4E342E;
    }
    .navbar-brand, .nav-link {
      color: #fff !important;
    }
    .container {
      margin-top: 40px;
    }
    .order-box {
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #4E342E;
      font-weight: bold;
      margin-bottom: 24px;
    }
    .form-label {
      font-weight: bold;
    }
    .btn-order {
      background-color: #FF7043;
      border: none;
      color: white;
      border-radius: 25px;
      padding: 10px 32px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-order:hover {
      background-color: #e55a2c;
    }
    #loginBtn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      border-radius: 25px;
      background: #FF7043;
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.2s;
    }
    #loginBtn:hover {
      background: #4E342E;
      color: #fff;
    }
    footer {
      background-color: #4E342E;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>
<script>
  // Kiểm tra trạng thái đăng nhập trước khi cho đặt món
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    alert("Bạn cần đăng nhập để đặt món!");
    window.location.href = "login.html";
  }
</script>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Cafe House</a>
  </div>
</nav>

<button id="loginBtn" onclick="handleLoginClick()">Đăng nhập</button>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 order-box">
      <h2>Đặt món: <span id="itemName">...</span></h2>
      <form id="orderForm">
        <div class="mb-3">
          <label for="quantity" class="form-label">Số lượng</label>
          <input type="number" class="form-control" id="quantity" value="1" min="1">
        </div>
        <div class="mb-3">
          <label class="form-label">Kích cỡ</label>
          <select class="form-select" id="size">
            <option value="S">Nhỏ</option>
            <option value="M" selected>Vừa</option>
            <option value="L">Lớn</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Tên người nhận</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input type="tel" class="form-control" id="phone" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Địa chỉ giao hàng</label>
          <textarea class="form-control" id="address" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Ghi chú (tuỳ chọn)</label>
          <input type="text" class="form-control" id="note">
        </div>
        <button type="submit" class="btn btn-order">Thêm vào giỏ hàng</button>
        <a href="menu.html" class="btn btn-light border ms-3">← Quay về thực đơn</a>
      </form>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2025 Cafe House | Thiết kế bởi Nhóm 4</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function updateLoginButton() {
    const username = localStorage.getItem('username');
    const loginBtn = document.getElementById('loginBtn');
    if (username) {
      loginBtn.textContent = `👋 ${username} | Đăng xuất`;
    } else {
      loginBtn.textContent = "Đăng nhập";
    }
  }
  function handleLoginClick() {
    const username = localStorage.getItem('username');
    if (username) {
      const confirmLogout = confirm("Bạn có chắc muốn đăng xuất?");
      if (confirmLogout) {
        localStorage.removeItem('username');
        localStorage.removeItem('password');
        localStorage.removeItem('isLoggedIn');
        alert("Đã đăng xuất.");
        updateLoginButton();
        window.location.reload();
      }
    } else {
      window.location.href = "login.html";
    }
  }
  updateLoginButton();

  // Hiển thị tên món
  const params = new URLSearchParams(window.location.search);
  const item = params.get('item');
  const menu = {
    cfden: { name: 'Cà phê đen', img: 'images/cfden.jpg' },
    cfsua: { name: 'Cà phê sữa', img: 'images/cfsua.jpg' },
    espresso: { name: 'Espresso', img: 'images/espresso.jpg' },
    capuchino: { name: 'Capuchino', img: 'images/capuchino.jpg' },
    trachanh: { name: 'Trà chanh', img: 'images/trachanh.jpg' },
    nuoccam: { name: 'Nước cam', img: 'images/nuoccam.jpg' },
    tradao: { name: 'Trà đào', img: 'images/tradao.jpg' },
    sodavietquat: { name: 'Soda việt quất', img: 'images/sodavietquat.jpg' },
    banhmi: { name: 'Bánh mì đặc biệt', img: 'images/banhmi.jpg' },
    croissant: { name: 'Croissant', img: 'images/croissant.jpg' },
    muffin: { name: 'Muffin socola', img: 'images/muffin.jpg' }
  };
  if (item && menu[item]) {
    document.getElementById('itemName').innerText = menu[item].name;
  } else {
    document.getElementById('itemName').innerText = "Không tìm thấy món này";
  }

  // Thêm vào giỏ hàng
  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    if (!item || !menu[item]) return;
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push({
      name: menu[item].name,
      img: menu[item].img,
      quantity: document.getElementById("quantity").value,
      size: document.getElementById("size").value,
      customer: {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        note: document.getElementById("note").value
      }
    });
    localStorage.setItem("cart", JSON.stringify(cart));
    alert("✅ Món đã được thêm vào giỏ hàng!");
    window.location.href = "cart.html";
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
